<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>માધાપરના ડૉક્ટર સાહેબ – પ્રાથમિક આરોગ્ય સલાહ</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@tailwindcss/browser@4';document.head.appendChild(s);"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600&family=Noto+Serif+Gujarati:wght@600;700&display=swap" rel="stylesheet" />

  <style type="text/tailwindcss">
    @theme {
      --color-indigo-kutch: #232F6B;
      --color-indigo-deep: #182050;
      --color-lime-wash: #F4F6F3;
      --color-madder: #B3392F;
      --color-haldi: #E0A526;
      --color-leaf: #2F7D5B;
      --font-serif: "Noto Serif Gujarati", serif;
      --font-sans: "Noto Sans Gujarati", system-ui, sans-serif;
    }
  </style>

  <style>
    body { font-family: 'Noto Sans Gujarati', system-ui, sans-serif; }

    .lippan {
      background-color: #232F6B;
      background-image:
        radial-gradient(circle at 50% 50%, #F4F6F3 0 2.5px, transparent 3px),
        radial-gradient(circle at 50% 50%, #E0A526 0 1.5px, transparent 2px);
      background-size: 22px 10px, 22px 10px;
      background-position: 0 0, 11px 5px;
    }

    .bubble-doctor { border-left: 4px solid #B3392F; }
    .bubble a { text-decoration: underline; }

    .dot { animation: bounce 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .mic-live { background: #B3392F !important; color: #fff !important; border-color: #B3392F !important; animation: pulse-ring 1.4s infinite; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(179, 57, 47, .5); }
      70% { box-shadow: 0 0 0 12px rgba(179, 57, 47, 0); }
      100% { box-shadow: 0 0 0 0 rgba(179, 57, 47, 0); }
    }

    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb { background: #c6cbd9; border-radius: 8px; }
  </style>
</head>

<body class="bg-lime-wash text-slate-800 min-h-screen">
  <main class="mx-auto flex h-screen max-w-3xl flex-col bg-white shadow-xl sm:my-0 md:h-[100dvh]">

    <!-- Header -->
    <header class="bg-indigo-kutch text-white">
      <div class="flex items-center gap-3 px-4 py-3 sm:px-6">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white text-indigo-kutch" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" stroke="#B3392F" stroke-width="3"/>
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="font-serif text-lg font-bold leading-snug sm:text-xl">ડૉક્ટર સાહેબ</h1>
          <p class="truncate text-sm text-indigo-100">માધાપર, ભુજ (કચ્છ) · પ્રાથમિક ઘરેલુ સલાહ</p>
        </div>
      </div>
      <div class="lippan h-[10px] w-full" aria-hidden="true"></div>
    </header>

    <!-- API key bar -->
    <section id="keyBar" class="border-b border-haldi/40 bg-amber-50 px-4 py-3 text-sm sm:px-6">
      <label for="keyInput" class="mb-1 block font-medium text-slate-700">OpenRouter API કી દાખલ કરો</label>
      <div class="flex gap-2">
        <input id="keyInput" type="password" autocomplete="off" placeholder="sk-or-v1-..."
               class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-kutch focus:outline-none focus:ring-2 focus:ring-indigo-kutch/30" />
        <button id="keySave" type="button"
                class="rounded-lg bg-indigo-kutch px-4 py-2 font-medium text-white hover:bg-indigo-deep focus:outline-none focus:ring-2 focus:ring-indigo-kutch focus:ring-offset-2">
          સાચવો
        </button>
      </div>
      <p class="mt-1 text-xs text-slate-500">કી ફક્ત આ બ્રાઉઝરમાં સચવાય છે.</p>
    </section>

    <!-- Chat window -->
    <section id="chat" role="log" aria-live="polite" aria-label="વાતચીત"
             class="flex-1 space-y-4 overflow-y-auto bg-lime-wash px-4 py-5 sm:px-6"></section>

    <!-- Quick symptoms -->
    <div id="chips" class="flex gap-2 overflow-x-auto border-t border-slate-200 bg-white px-4 py-2 sm:px-6" aria-label="ઝડપી લક્ષણો"></div>

    <!-- Input -->
    <form id="form" class="border-t border-slate-200 bg-white px-4 py-3 sm:px-6">
      <p id="voiceStatus" class="mb-2 min-h-[1.25rem] text-sm font-medium text-indigo-kutch" role="status" aria-live="polite"></p>

      <div class="mb-2 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-slate-700">
        <label class="flex cursor-pointer items-center gap-2">
          <input id="speakToggle" type="checkbox" checked class="h-4 w-4 accent-[#232F6B]" />
          જવાબ બોલીને સંભળાવો
        </label>
        <label class="flex cursor-pointer items-center gap-2">
          <input id="autoSendToggle" type="checkbox" checked class="h-4 w-4 accent-[#232F6B]" />
          બોલ્યા પછી આપમેળે મોકલો
        </label>
        <button id="stopSpeak" type="button"
                class="hidden rounded-full bg-madder px-3 py-1 text-xs font-medium text-white hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-madder focus:ring-offset-2">
          ⏹ બોલવાનું બંધ કરો
        </button>
      </div>

      <div class="flex items-end gap-2">
        <button id="mic" type="button" aria-pressed="false" aria-label="બોલીને લક્ષણ જણાવો" title="બોલીને લક્ષણ જણાવો"
                class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-indigo-kutch/30 bg-lime-wash text-indigo-kutch transition hover:bg-indigo-kutch hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-kutch focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="currentColor" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/>
          </svg>
        </button>
        <label for="input" class="sr-only">તમારા લક્ષણો લખો</label>
        <textarea id="input" rows="1" maxlength="800"
                  placeholder="તમારા લક્ષણો લખો… (દા.ત. બે દિવસથી તાવ અને ગળામાં દુખાવો)"
                  class="max-h-32 min-h-[48px] flex-1 resize-none rounded-xl border border-slate-300 px-4 py-3 text-base placeholder:text-slate-400 focus:border-indigo-kutch focus:outline-none focus:ring-2 focus:ring-indigo-kutch/30"></textarea>
        <button id="send" type="submit"
                class="flex h-12 shrink-0 items-center gap-2 rounded-xl bg-madder px-5 font-semibold text-white transition hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-madder focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          <span>મોકલો</span>
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12 2-12 2z"/></svg>
        </button>
      </div>
      <p class="mt-2 text-xs text-slate-500">ગંભીર તકલીફમાં તરત <strong class="text-madder">108</strong> પર ફોન કરો.</p>
    </form>
  </main>

  <script>
    // DOM Elements
    const chat = document.getElementById('chat');
    const chipsContainer = document.getElementById('chips');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const micBtn = document.getElementById('mic');
    const voiceStatus = document.getElementById('voiceStatus');
    const keyBar = document.getElementById('keyBar');
    const keyInput = document.getElementById('keyInput');
    const keySave = document.getElementById('keySave');
    const speakToggle = document.getElementById('speakToggle');
    const autoSendToggle = document.getElementById('autoSendToggle');
    const stopSpeakBtn = document.getElementById('stopSpeak');

    let apiKey = localStorage.getItem('openrouter_api_key') || '';
    let synthesis = window.speechSynthesis;
    let currentUtterance = null;
    let recognition = null;

    const SYSTEM_PROMPT = `તમે માધાપર (કચ્છ) ના ગ્રામીણ વિસ્તાર માટે બનાવેલા એક અત્યંત બુદ્ધિશાળી અને અનુભવી AI મેડિકલ આસિસ્ટન્ટ છો. તમારી પાસે સામાન્ય બુદ્ધિ (Common Sense), એલોપેથી, આયુર્વેદ, અને ઘરગથ્થુ ઉપચારોનું ઊંડું ચિકિત્સા જ્ઞાન છે. જ્યારે દર્દી ગુજરાતીમાં લક્ષણો જણાવે ત્યારે પહેલા સાંત્વના આપો. ત્યારબાદ મુદ્દાસર (Bullet points) જવાબ આપો: સંભવિત બીમારીનું કારણ -> એલોપેથી પ્રાથમિક સારવાર (દા.ત. શરદી-તાવ માટે Paracetamol 500mg) -> આયુર્વેદિક/ઘરગથ્થુ ઉપચાર (દા.ત. ઉધરસ માટે હળદર-મીઠાના કોગળા) -> શું સાવચેતી રાખવી. ટોન એકદમ દયાળુ રાખવો. દરેક જવાબના અંતમાં કડક શબ્દોમાં આ ચેતવણી લખવી: 'આ કોઈ અંતિમ ડૉક્ટરની સલાહ નથી. ગંભીર લક્ષણો હોય તો વિલંબ કર્યા વગર ભુજ સિવિલ હોસ્પિટલનો સંપર્ક કરવો.'`;

    const QUICK_CHIPS = ['તાવ આવે છે', 'શરદી અને ઉધરસ', 'પેટમાં દુખાવો', 'માથું દુખે છે'];

    // Initialize Key Bar Visibility
    if (!apiKey) {
      keyBar.classList.remove('hidden');
    }

    keySave.addEventListener('click', () => {
      const val = keyInput.value.trim();
      if (val) {
        apiKey = val;
        localStorage.setItem('openrouter_api_key', val);
        keyBar.classList.add('hidden');
        appendMessage('system', 'API કી સફળતાપૂર્વક સાચવવામાં આવી છે.');
      }
    });

    // Render Quick Chips
    QUICK_CHIPS.forEach(symptom => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shrink-0 rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-indigo-kutch hover:text-white';
btn.textContent = symptom;
btn.addEventListener('click', () => {
input.value = symptom;
form.requestSubmit();
});
chipsContainer.appendChild(btn);
});
// Auto-resize textarea
input.addEventListener('input', () => {
input.style.height = 'auto';
input.style.height = input.scrollHeight + 'px';
});
// Text to Speech
function speakText(text) {
if (!speakToggle.checked || !synthesis) return;
stopSpeaking();
// Clean up markdown text for better speech flow
const cleanText = text.replace(/[*#`_-]/g, '');
currentUtterance = new SpeechSynthesisUtterance(cleanText);
currentUtterance.lang = 'gu-IN';
currentUtterance.onstart = () => stopSpeakBtn.classList.remove('hidden');
currentUtterance.onend = () => stopSpeakBtn.classList.add('hidden');
currentUtterance.onerror = () => stopSpeakBtn.classList.add('hidden');
synthesis.speak(currentUtterance);
}
function stopSpeaking() {
if (synthesis && synthesis.speaking) {
synthesis.cancel();
}
stopSpeakBtn.classList.add('hidden');
}
stopSpeakBtn.addEventListener('click', stopSpeaking);
// Speech to Text (Voice Input)
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
recognition = new SpeechRecognition();
recognition.lang = 'gu-IN';
recognition.continuous = false;
recognition.interimResults = false;
recognition.onstart = () => {
micBtn.classList.add('mic-live');
micBtn.setAttribute('aria-pressed', 'true');
voiceStatus.textContent = '🎙️ હું સાંભળી રહ્યો છું, બોલો...';
};
recognition.onresult = (event) => {
const text = event.results[0][0].transcript;
input.value = text;
input.dispatchEvent(new Event('input'));
voiceStatus.textContent = '';
if (autoSendToggle.checked) {
form.requestSubmit();
}
};
recognition.onerror = () => {
voiceStatus.textContent = '❌ અવાજ ઓળખવામાં ભૂલ થઈ. ફરી પ્રયત્ન કરો.';
cleanupMic();
};
recognition.onend = () => {
cleanupMic();
};
function cleanupMic() {
micBtn.classList.remove('mic-live');
micBtn.setAttribute('aria-pressed', 'false');
if (voiceStatus.textContent.startsWith('🎙️')) voiceStatus.textContent = '';
}
micBtn.addEventListener('click', () => {
if (micBtn.classList.contains('mic-live')) {
recognition.stop();
} else {
stopSpeaking();
recognition.start();
}
});
} else {
micBtn.disabled = true;
micBtn.title = 'તમારા બ્રાઉઝરમાં વોઇસ ટાઇપિંગ સપોર્ટ નથી';
}
// Append Message to UI
function appendMessage(sender, text) {
const wrapper = document.createElement('div');
wrapper.className = flex ${sender === 'user' ? 'justify-end' : 'justify-start'};
const bubble = document.createElement('div');
bubble.className = bubble max-w-[85%] rounded-2xl px-4 py-2.5 text-base shadow-sm leading-relaxed ${ sender === 'user'  ? 'bg-indigo-kutch text-white rounded-br-none'  : sender === 'system' ? 'bg-amber-100 text-amber-900 border border-amber-300 text-center mx-auto' : 'bg-white text-slate-800 rounded-bl-none bubble-doctor' };
bubble.innerText = text;
wrapper.appendChild(bubble);
chat.appendChild(wrapper);
chat.scrollTop = chat.scrollHeight;
return bubble;
}
// Append Typing Indicator
function appendTypingIndicator() {
const wrapper = document.createElement('div');
wrapper.className = 'flex justify-start id-loader';
wrapper.innerHTML = <div class="bg-white rounded-2xl px-5 py-4 shadow-sm flex gap-1 items-center rounded-bl-none bubble-doctor"> <span class="dot h-2 w-2 rounded-full bg-indigo-kutch inline-block"></span> <span class="dot h-2 w-2 rounded-full bg-indigo-kutch inline-block"></span> <span class="dot h-2 w-2 rounded-full bg-indigo-kutch inline-block"></span> </div>;
chat.appendChild(wrapper);
chat.scrollTop = chat.scrollHeight;
return wrapper;
}
// Form Submit (Send Message to OpenRouter API)
form.addEventListener('submit', async (e) => {
e.preventDefault();
const text = input.value.trim();
if (!text) return;
if (!apiKey) {
keyBar.classList.remove('hidden');
keyInput.focus();
alert('કૃપા કરીને પહેલા OpenRouter API કી દાખલ કરો.');
return;
}
appendMessage('user', text);
input.value = '';
input.style.height = 'auto';
stopSpeaking();
const loader = appendTypingIndicator();
try {
// Using the ultra-fast and reliable free model: google/gemini-2.5-flash:free
const response = await fetch('openrouter.ai', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'Authorization': Bearer ${apiKey},
'HTTP-Referer': window.location.href,
'X-Title': 'AI Rural Doctor Saheb'
},
body: JSON.stringify({
model: 'google/gemini-2.5-flash:free',
messages: [
{ role: 'system', content: SYSTEM_PROMPT },
{ role: 'user', content: text }
]
})
});
loader.remove();
if (!response.ok) {
throw new Error('API Request Failed');
}
const data = await response.json();
const aiResponse = data.choices[0].message.content;
appendMessage('doctor', aiResponse);
speakText(aiResponse);
} catch (err) {
if (loader) loader.remove();
appendMessage('doctor', 'જવાબ મળી શક્યો નહીં. કૃપા કરીને તમારી API કી તપાસો અને ફરી પ્રયત્ન કરો.');
}
});
// Initial Welcome Message
appendMessage('doctor', 'નમસ્તે! હું માધાપર વિજ્ઞાન મેળાનો AI મેડિકલ આસિસ્ન્ટ છું. તમને અથવા પરિવારમાં કોઈને સ્વાસ્થ્ય અંગે શું તકલીફ છે? કૃપા કરીને વિગતે જણાવો.');
